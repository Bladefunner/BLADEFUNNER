<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLADEFUNNER - 极致沉浸式学习</title>
    <style>
        /* ================= 1. 全局样式 & Apple 设计规范 ================= */
        :root {
            --bg-color: #f5f5f7;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --apple-blue: #0066cc;
            --nav-bg: rgba(255, 255, 255, 0.8);
            --card-bg: #ffffff;
            --border-radius: 18px;
            --shadow: 0 8px 30px rgba(0,0,0,0.04);
            --accent-soft: #e8f2ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 导航栏 */
        nav {
            position: fixed; top: 0; width: 100%; height: 48px;
            background: var(--nav-bg); backdrop-filter: saturate(180%) blur(20px);
            display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.08); z-index: 1000;
        }
        .nav-container { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; padding: 0 22px; }
        .logo { font-weight: 700; font-size: 18px; cursor: pointer; letter-spacing: -0.03em; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { text-decoration: none; color: var(--text-main); font-size: 12px; opacity: 0.7; cursor: pointer; transition: 0.2s; }
        .nav-links a:hover { opacity: 1; color: var(--apple-blue); }

        /* 视图容器 */
        .view-section { display: none; padding-top: 80px; min-height: 100vh; max-width: 1000px; margin: 0 auto; animation: fadeIn 0.4s ease forwards; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 通用组件 */
        .section-title { font-size: 40px; font-weight: 700; text-align: center; margin-bottom: 40px; letter-spacing: -0.02em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; padding: 0 20px; }
        .card { 
            background: var(--card-bg); border-radius: var(--border-radius); padding: 32px; 
            box-shadow: var(--shadow); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 15px 45px rgba(0,0,0,0.1); }
        .card h3 { font-size: 22px; margin-bottom: 10px; }
        .card p { color: var(--text-muted); font-size: 14px; }

        /* ================= 2. 学习界面布局 ================= */
        .learning-layout { display: flex; gap: 24px; padding: 0 20px; flex-wrap: wrap; margin-bottom: 80px; }
        .main-reader { flex: 2; min-width: 350px; background: #fff; border-radius: var(--border-radius); padding: 40px; box-shadow: var(--shadow); position: relative; }
        .sidebar { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 24px; }

        /* 剧本区控制 */
        .script-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 1px solid #f2f2f7; padding-bottom: 15px; }
        .script-line { margin-bottom: 24px; padding-left: 10px; border-left: 3px solid transparent; transition: 0.2s; }
        .script-line:hover { border-left-color: var(--apple-blue); background: #fafafa; }
        .role-name { font-weight: 700; color: var(--apple-blue); font-size: 14px; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .en-text { font-size: 19px; color: #1d1d1f; display: block; }
        .cn-text { font-size: 14px; color: var(--text-muted); margin-top: 6px; display: block; }

        /* 模式切换按钮 */
        .mode-selector { margin-top: 30px; display: flex; gap: 10px; }
        .btn { 
            background: var(--apple-blue); color: #fff; border: none; padding: 10px 18px; 
            border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .btn-secondary { background: var(--accent-soft); color: var(--apple-blue); }
        .btn:hover { opacity: 0.8; transform: scale(1.02); }

        /* 学习挂件 */
        .widget { background: #fff; border-radius: var(--border-radius); padding: 24px; box-shadow: var(--shadow); }
        .widget h4 { margin-bottom: 16px; font-size: 15px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        audio { width: 100%; margin: 10px 0; }

        /* 划词 & 挖空样式 */
        .hidden-word { background: #e2e2e7; color: transparent; border-radius: 4px; padding: 0 4px; cursor: pointer; transition: 0.2s; }
        .hidden-word.revealed { background: transparent; color: inherit; }
        
        #dict-popup {
            position: absolute; display: none; background: #1d1d1f; color: #fff;
            padding: 14px; border-radius: 14px; font-size: 14px; z-index: 2000;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3); width: 200px;
        }
        #dict-popup b { color: #5fb1ff; display: block; margin-bottom: 4px; }
        #dict-popup button { 
            width: 100%; margin-top: 12px; background: var(--apple-blue); 
            border: none; color: white; border-radius: 8px; padding: 8px; cursor: pointer; font-size: 12px;
        }

        /* 生词本列表 (奶酪单词风) */
        #vocab-list { list-style: none; margin-top: 10px; }
        .vocab-item { 
            display: flex; flex-direction: column; padding: 12px 0; 
            border-bottom: 1px solid #f2f2f7; animation: fadeIn 0.3s ease;
        }
        .vocab-item b { color: var(--apple-blue); font-size: 16px; }
        .vocab-item span { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo" onclick="showView('home')">BLADEFUNNER</div>
            <div class="nav-links">
                <a onclick="showView('home')">WHATFUN</a>
                <a onclick="showView('explore')">EXPLORE</a>
            </div>
        </div>
    </nav>

    <!-- 1. 首页 (Hero View) -->
    <section id="home-view" class="view-section active">
        <div style="text-align:center; margin-top: 18vh;">
            <h1 style="font-size: 72px; letter-spacing: -0.04em; margin-bottom: 10px;">Focus on fun.</h1>
            <p style="font-size: 26px; color: var(--text-muted); font-weight: 300;">你的私人多维语言实验室</p>
        </div>
    </section>

    <!-- 2. 探索类目 (Categories) -->
    <section id="explore-view" class="view-section">
        <h2 class="section-title">探索未来角色</h2>
        <div class="grid" id="category-grid">
            <!-- 由 JS 填充 -->
        </div>
    </section>

    <!-- 3. 剧本库 (Library) -->
    <section id="library-view" class="view-section">
        <h2 class="section-title" id="library-name">剧本资源库</h2>
        <div class="grid" id="episode-grid">
            <!-- 由 JS 填充 -->
        </div>
    </section>

    <!-- 4. 核心学习界面 (Study) -->
    <section id="study-view" class="view-section">
        <div class="learning-layout">
            <!-- 左侧：交互式阅读窗口 -->
            <div class="main-reader">
                <div class="script-header">
                    <h2 id="study-title">加载中...</h2>
                    <span id="study-subtitle" style="font-size: 13px; color: var(--text-muted);">Season 1 Episode 1</span>
                </div>
                
                <div id="script-display" class="script-content">
                    <!-- 动态生成台词 -->
                </div>

                <div class="mode-selector">
                    <button class="btn" onclick="setMode('normal')">逐句跟读</button>
                    <button class="btn btn-secondary" onclick="setMode('cloze')">挖空听写</button>
                    <button class="btn btn-secondary" onclick="setMode('full')">全句遮盖</button>
                </div>
            </div>

            <!-- 右侧：挂件栏 -->
            <div class="sidebar">
                <!-- 播放器 -->
                <div class="widget">
                    <h4>Media Player</h4>
                    <audio id="audio-player" controls></audio>
                    <div style="margin-top:15px; display: flex; gap: 8px;">
                        <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('audio-player').currentTime -= 3">快退 3s</button>
                        <button class="btn btn-secondary" style="flex:1" onclick="replaySentence()">重听本句</button>
                    </div>
                </div>

                <!-- 生词本 -->
                <div class="widget">
                    <h4>Vocab Book (生词本)</h4>
                    <div style="display:flex; gap: 10px; margin-bottom: 10px;">
                        <button class="btn" style="flex:1; font-size:11px;" onclick="alert('开始巩固练习模式')">巩固练习</button>
                        <button class="btn btn-secondary" style="flex:1; font-size:11px;" onclick="clearVocab()">清空</button>
                    </div>
                    <ul id="vocab-list">
                        <!-- JS 填充 -->
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- 划词翻译弹窗 -->
    <div id="dict-popup">
        <b id="pop-word">WORD</b>
        <p id="pop-def">获取释义中...</p>
        <button onclick="saveWord()">加入生词本</button>
    </div>

    <script>
        /* ================= 3. 数据驱动层 ================= */
        const APP_DATA = {
            categories: [
                { id: 'english', name: 'ENGLISH', desc: '美剧台词、口语模仿、听力特训' },
                { id: 'pottery', name: 'CERAMICS', desc: '陶艺术语与艺术探索 (Soon)' },
                { id: 'advertising', name: 'ADVERTISING', desc: '广告创意与设计笔记 (Soon)' }
            ],
            library: {
                english: [
                    { id: 'friends_s1e1', title: 'Friends S01E01', sub: 'Monica Gets a Roommate' }
                ]
            },
            episodes: {
                "friends_s1e1": {
                    audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", // 部署后替换为你的 audio/s1e1.mp3
                    content: [
                        { role: "Monica", en: "There's nothing to tell! He's just some guy I work with!", cn: "没什么好说的！他只是我一个同事而已！" },
                        { role: "Joey", en: "C'mon, you're going out with the guy! There's gotta be something wrong with him!", cn: "拜托，你要跟那人约会耶！他肯定有问题！" },
                        { role: "Chandler", en: "All right Joey, be nice. So does he have a hump? A hump and a hairpiece?", cn: "好啦 Joey，厚道点。他背上有驼峰吗？驼峰加假发？" },
                        { role: "Phoebe", en: "Wait, does he eat chalk?", cn: "等等，他吃粉笔吗？" }
                    ]
                }
            }
        };

        const MOCK_DICT = { "hump": "n. 驼峰；肉峰", "hairpiece": "n. 假发", "chalk": "n. 粉笔" };
        
        let currentMode = 'normal';
        let currentEpisodeId = null;
        let selectedWord = "";

        /* ================= 4. 核心逻辑层 ================= */

        // 导航控制
        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById(viewId + '-view').classList.add('active');
            if(viewId === 'explore') renderCategories();
            window.scrollTo(0,0);
        }

        // 渲染类目页
        function renderCategories() {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = APP_DATA.categories.map(c => `
                <div class="card" onclick="openLibrary('${c.id}')">
                    <h3>${c.name}</h3>
                    <p>${c.desc}</p>
                </div>
            `).join('');
        }

        // 打开剧本列表
        function openLibrary(catId) {
            const lib = APP_DATA.library[catId];
            if(!lib) { alert("该板块还在筹备中..."); return; }
            document.getElementById('library-name').innerText = catId.toUpperCase() + " 剧本库";
            const grid = document.getElementById('episode-grid');
            grid.innerHTML = lib.map(ep => `
                <div class="card" onclick="startStudy('${ep.id}')">
                    <h3>${ep.title}</h3>
                    <p>${ep.sub}</p>
                </div>
            `).join('');
            showView('library');
        }

        // 进入学习界面
        function startStudy(epId) {
            currentEpisodeId = epId;
            const data = APP_DATA.episodes[epId];
            document.getElementById('study-title').innerText = APP_DATA.library.english.find(x => x.id === epId).title;
            document.getElementById('audio-player').src = data.audio;
            renderScript();
            showView('study');
        }

        // 渲染剧本台词 (支持三种模式)
        function renderScript() {
            const display = document.getElementById('script-display');
            const lines = APP_DATA.episodes[currentEpisodeId].content;

            display.innerHTML = lines.map(line => {
                let htmlEn = line.en;
                
                if (currentMode === 'cloze') {
                    // 挖空逻辑：随机隐藏长单词
                    htmlEn = line.en.split(' ').map(word => 
                        (word.length > 4 && Math.random() > 0.4) 
                        ? `<span class="hidden-word" onclick="this.classList.toggle('revealed')">${word}</span>` 
                        : word
                    ).join(' ');
                } else if (currentMode === 'full') {
                    // 全句隐藏
                    htmlEn = `<span class="hidden-word" style="display:inline-block; width:100%;" onclick="this.classList.toggle('revealed')">${line.en}</span>`;
                }

                return `
                    <div class="script-line">
                        <span class="role-name">${line.role}</span>
                        <span class="en-text">${htmlEn}</span>
                        <span class="cn-text">${line.cn}</span>
                    </div>
                `;
            }).join('');
        }

        function setMode(mode) {
            currentMode = mode;
            renderScript();
        }

        function replaySentence() {
            const player = document.getElementById('audio-player');
            player.currentTime = 0; // 此处可根据未来时间戳数据优化为跳回单句起始点
            player.play();
        }

        /* ================= 5. 词典与生词本逻辑 ================= */

        // 划词监听
        document.getElementById('script-display').addEventListener('mouseup', function(e) {
            const text = window.getSelection().toString().trim().toLowerCase().replace(/[^a-z]/g, '');
            if (text.length > 1) {
                selectedWord = text;
                const popup = document.getElementById('dict-popup');
                document.getElementById('pop-word').innerText = text.toUpperCase();
                document.getElementById('pop-def').innerText = MOCK_DICT[text] || "未找到释义，可点击下方保存。";
                popup.style.display = 'block';
                popup.style.left = e.pageX + 'px';
                popup.style.top = (e.pageY - 100) + 'px';
            }
        });

        document.addEventListener('mousedown', (e) => {
            if(!document.getElementById('dict-popup').contains(e.target)) {
                document.getElementById('dict-popup').style.display = 'none';
            }
        });

        function saveWord() {
            let vocabs = JSON.parse(localStorage.getItem('blade_words') || '[]');
            if(!vocabs.some(v => v.w === selectedWord)) {
                vocabs.push({ w: selectedWord, d: MOCK_DICT[selectedWord] || '自定义词条' });
                localStorage.setItem('blade_words', JSON.stringify(vocabs));
                renderVocab();
            }
            document.getElementById('dict-popup').style.display = 'none';
        }

        function renderVocab() {
            const list = document.getElementById('vocab-list');
            const vocabs = JSON.parse(localStorage.getItem('blade_words') || '[]');
            if(vocabs.length === 0) {
                list.innerHTML = '<li style="color:#ccc; font-size:12px; text-align:center; padding:20px;">还没有生词哦</li>';
                return;
            }
            list.innerHTML = vocabs.reverse().map(v => `
                <li class="vocab-item">
                    <b>${v.w}</b>
                    <span>${v.d}</span>
                </li>
            `).join('');
        }

        function clearVocab() {
            if(confirm("确定要清空生词本吗？")) {
                localStorage.removeItem('blade_words');
                renderVocab();
            }
        }

        window.onload = renderVocab;

    </script>
</body>
</html>
